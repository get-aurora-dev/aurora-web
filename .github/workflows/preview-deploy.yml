name: Deploy PR Preview to Aurora Web Previews Project
on:
  # Intentional: deploys fork PR builds with secrets but never checks out or runs PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Build PR Preview"]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the artifact from the build run
      pull-requests: write # comment the preview link on the PR
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview
          path: preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # pr.txt comes from untrusted code; only accept a plain number
      - name: Validate PR number
        id: pr
        run: |
          PR=$(cat preview/pr.txt)
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "Invalid PR number"; exit 1; }
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy preview/site --project-name=aurora-web-previews --branch=pr-${{ steps.pr.outputs.number }}

      - name: Comment preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Preview: https://pr-$PR_NUMBER.aurora-web-previews.pages.dev" \
            --edit-last --create-if-none
