# Builds PRs (incl. forks) with NO secrets. Deploy happens in preview-deploy.yml.
name: Build PR Preview
on: pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # read-only token for fork PRs; only used to avoid GitHub API rate limits in cache-contributors
      - run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p preview
          cp -r out preview/site
          echo "${{ github.event.pull_request.number }}" > preview/pr.txt
      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview
          retention-days: 3
