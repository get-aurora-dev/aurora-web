# Builds PRs (incl. forks) with NO secrets. Deploy happens in preview-deploy.yml.
name: Build PR Preview
on: pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # read-only token for fork PRs; only used to avoid GitHub API rate limits in cache-contributors
      - run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p preview
          cp -r out preview/site
          echo "${{ github.event.pull_request.number }}" > preview/pr.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview
          path: preview
          retention-days: 3
